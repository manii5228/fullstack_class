<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="main">

<h2>ADMIN PANEL</h2>

<div class="card">

<h3>Create User</h3>

<input id="u" placeholder="username">

<input id="p" placeholder="password">

<button onclick="addUser()">

Create User

</button>

</div>

<div class="card">

<h3>All Events</h3>

<table id="tbl">

<tr>

<th>User</th>
<th>Event</th>
<th>Priority</th>
<th>Category</th>
<th>Time</th>

</tr>

</table>

</div>

<button onclick="logout()">

Logout

</button>

</div>

<script src="admin.js"></script>

</body>

</html>
