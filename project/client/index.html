<link rel="stylesheet" href="style.css">

<div class="sidebar">

<h2>SYNC ENGINE</h2>

<div class="profileBox">

<p id="profileName"></p>

<p>Total Events</p>

<h3 id="totalEvents">0</h3>

<div id="contributionGrid"></div>

<button onclick="logout()">

Logout

</button>

</div>

</div>

<div class="main">

<div class="stats">

<div class="card">

Total Events

<p id="eventCount">0</p>

</div>

<div class="card">

Active Users

<p id="userCount">0</p>

</div>

<div class="card">

Events/sec

<p id="rate">0</p>

</div>

</div>

<div class="event-controls">

<input
id="eventInput"
placeholder="event message">

<select id="priority">

<option>Low</option>

<option>Medium</option>

<option>High</option>

</select>

<select id="category">

<option>System</option>

<option>User</option>

<option>IoT</option>

</select>

<button onclick="sendEvent()">

Send

</button>

</div>

<input
id="searchBox"
placeholder="search">

<ul id="eventList"></ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="script.js"></script>
