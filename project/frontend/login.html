<!DOCTYPE html>
<html>

<head>
<title>Login</title>
</head>

<body>

<h2>Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="email"
required
/>

<br><br>

<input
type="password"
id="password"
placeholder="password"
required
/>

<br><br>

<button type="submit">

Login

</button>

</form>

<p id="result"></p>

<script>

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const response =
await fetch(
"http://localhost:3000/api/auth/login",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email,
password

})

});

const data =
await response.json();

document
.getElementById("result")
.innerText =
JSON.stringify(data);

localStorage.setItem(
"token",
data.token
);

}
);

</script>

</body>
</html>
